modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-V3.0"

[[mods]]
modId="superbhorizon"
version="0.1.1"
displayName="Superb Horizons"
authors = "VellEagle"
logoFile = "sbhlogo.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/superb-horizons"
description='''This mod allows vehicle entities in Superb Warfare to be displayed as ghost models even when they are outside the draw distance.'''

# SuperbWarfare dependency
[[dependencies.${mod_id}]]
    modId="superbwarfare"
    mandatory=true
    versionRange="[0.8.0,)"
    ordering="AFTER"
    side="BOTH"

# Forge dependency
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
