[[mods]]
modId="superbhorizons"
version="1.0.1"
displayName="Superb Horizons"
authors="VellEagle"
description='''
Superb Horizons renders vehicles from Superb Warfare as ghost models even when they are beyond the normal draw distance. This mod is intended to be used in conjunction with distant horizons.
'''

[[dependencies.superbhorizons]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.superbhorizons]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Superb Warfare 本体。mandatory=false にしてあるので、
# SBW の modId が違っていても起動が止まることはありません。
# 正しい modId が確認できたら mandatory=true にしてください。
[[dependencies.superbhorizons]]
    modId="superbwarfare"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
